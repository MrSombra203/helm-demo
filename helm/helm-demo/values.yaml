replicaCount: 2

image:
  repository: helm-demo
  tag: "1.0.0"
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: helm-demo.local
  annotations: {}

app:
  name: helm-demo
  environment: Desarrollo
  version: "1.0.0"
  message: Aplicación desplegada correctamente con Helm

extraEnv: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
