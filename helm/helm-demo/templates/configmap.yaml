apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm-demo.fullname" . }}
  labels:
    {{- include "helm-demo.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.app.name | quote }}
  APP_ENVIRONMENT: {{ .Values.app.environment | quote }}
  APP_VERSION: {{ .Values.app.version | quote }}
  APP_MESSAGE: {{ .Values.app.message | quote }}
